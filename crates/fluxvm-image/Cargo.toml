[package]
name = "fluxvm-image"
version = "0.4.15"
edition = "2024"
license = "Apache-2.0"
description = "Image build/clone and cloud-init seed generation for Zyvor FluxVM"

[dependencies]
tempfile = "3"
fluxvm-core = { path = "../fluxvm-core" }
fluxvm-guest-protocol = { path = "../fluxvm-guest-protocol" }
guestkit = { path = "../../../guestkit", features = ["registry-write", "agent"] }
anyhow = "1"
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["rand_core"] }
flate2 = "1"
roxmltree = "0.21"
tar = "0.4"
zstd = "0.14"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tracing = "0.1"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
