[package]
name = "fluxvm-core"
version = "0.4.21"
edition = "2024"
license = "LicenseRef-Zyvor-Production-2.0"
description = "Shared domain types, config, and VmBackend trait for Zyvor FluxVM"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
fluxvm-cgroup = { path = "../fluxvm-cgroup" }
ed25519-dalek = { version = "3", features = ["rand_core"] }
libc = "0.2"
rand = "0.10"
regex = "1"
ring = "0.17"
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
time = "0.3"
