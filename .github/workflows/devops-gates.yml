name: DevOps gates

on:
  push:
    branches: [main]
  pull_request:

# Collapse superseded runs of this workflow on the same ref so queued duplicates do not hold the org's runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Contract + example tests
        working-directory: examples/devops
        run: python3 -m unittest test_contract.py test_examples.py -v
      - name: Offline devops-gate
        run: bash scripts/test-devops-gate.sh
      - name: Shipped systemd units verify
        run: REQUIRE_SYSTEMD_ANALYZE=1 bash scripts/verify-systemd-units.sh
      - name: Upgrade snapshot dry-run
        run: bash scripts/test-upgrade-snapshot.sh
