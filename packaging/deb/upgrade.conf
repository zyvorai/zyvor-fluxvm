# /etc/fluxvm/upgrade.conf: what a package upgrade does to a running fluxvm daemon.
# The unit uses KillMode=process, so restarting the daemon leaves running VMs alone (it reattaches to them).
#   no   keep the old daemon running until you restart it yourself (the default)
#   yes  restart the daemon after the new files are in place
RESTART_ON_UPGRADE=no
