# FluxVM Studio (ui/): typecheck, unit tests and a production build on pull requests. The built bundle
# (ui/node/dist) is committed and embedded in the daemon, so this also fails when it is stale: rebuild with
# `npm --prefix ui ci && npm --prefix ui run build` and commit the result.
name: UI check
on:
  pull_request:
    paths: ['ui/**', '.github/workflows/ui-check.yml']
permissions:
  contents: read
concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted","Linux","X64","zyvor-build"]') }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
    - run: npm --prefix ui ci
    - name: Typecheck
      run: npm --prefix ui run typecheck
    - name: Unit tests
      run: npm --prefix ui test
    - name: Build
      run: npm --prefix ui run build
    - name: The committed bundle is up to date
      run: |
        if ! git diff --quiet -- ui/node/dist || [ -n "$(git ls-files --others --exclude-standard ui/node/dist)" ]; then
          git status --short ui/node/dist
          echo "::error::ui/node/dist is stale. Run: npm --prefix ui ci && npm --prefix ui run build, then commit it."
          exit 1
        fi
