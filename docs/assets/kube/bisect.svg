<text x="445" y="222" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="700">first failing: auto-4   ·   last good: auto-3</text>
<text x="445" y="250" font-size="13" fill="#5d6577" text-anchor="middle" font-weight="400">① newest · ② oldest · ③ middle · ④⑤ narrow down — about log₂(n) restores</text>
<text x="445" y="274" font-size="13" fill="#5d6577" text-anchor="middle" font-weight="400">it saves the cluster first and puts the present back at the end</text>
