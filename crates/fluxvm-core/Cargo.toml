[package]
name = "fluxvm-core"
version = "0.4.16"
edition = "2024"
license = "Apache-2.0"
description = "Shared domain types, config, and VmBackend trait for Zyvor FluxVM"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
fluxvm-cgroup = { path = "../fluxvm-cgroup" }
ed25519-dalek = { version = "3", features = ["rand_core"] }
libc = "0.2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
