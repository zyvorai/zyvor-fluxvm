[package]
name = "fluxvm-apple"
version = "0.4.7"
edition = "2024"
license = "Apache-2.0"
description = "Apple Virtualization.framework backend (macOS on Apple silicon) for Zyvor FluxVM"
build = "build.rs"

[dependencies]
fluxvm-core = { path = "../fluxvm-core" }
fluxvm-oci-init = { path = "../fluxvm-oci-init" }
fluxvm-vz-switch = { path = "../fluxvm-vz-switch" }
fluxvm-usernet = { path = "../fluxvm-usernet" }
fluxvm-netobs = { path = "../fluxvm-netobs" }
anyhow = "1"
async-trait = "0.1"
ed25519-dalek = "2"
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
fluxvm-guest-protocol = { path = "../fluxvm-guest-protocol" }
tempfile = "3"
