<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 252" width="920" height="252" role="img" aria-label="The chaos loop" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The chaos loop</title>
<rect x="0.5" y="0.5" width="919" height="251" rx="14" fill="#f5f6f8" stroke="#d5d9e2"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8296"/></marker></defs>
<text x="450" y="32" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="700">kube chaos: break it, check it, put it back</text>
<rect x="28" y="92" width="150" height="70" rx="10" fill="#fff" stroke="#3b6fd4" stroke-width="2"/>
<text x="103.0" y="132.0" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="600">Checkpoint</text>
<text x="103" y="148" font-size="10.5" fill="#5d6577" text-anchor="middle" font-weight="400">chaos-start</text>
<line x1="178" y1="127" x2="206" y2="127" stroke="#7b8296" stroke-width="2" marker-end="url(#a)"/>
<rect x="206" y="92" width="150" height="70" rx="10" fill="#fff" stroke="#d1453b" stroke-width="2"/>
<text x="281.0" y="132.0" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="600">Break</text>
<text x="281" y="148" font-size="10.5" fill="#5d6577" text-anchor="middle" font-weight="400">kill-pod · stop-k3s · fill-disk</text>
<line x1="356" y1="127" x2="384" y2="127" stroke="#7b8296" stroke-width="2" marker-end="url(#a)"/>
<rect x="384" y="92" width="150" height="70" rx="10" fill="#fff" stroke="#8a90a0" stroke-width="2"/>
<text x="459.0" y="132.0" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="600">Hold</text>
<text x="459" y="148" font-size="10.5" fill="#5d6577" text-anchor="middle" font-weight="400">--hold 20 s</text>
<line x1="534" y1="127" x2="562" y2="127" stroke="#7b8296" stroke-width="2" marker-end="url(#a)"/>
<rect x="562" y="92" width="150" height="70" rx="10" fill="#fff" stroke="#d98e04" stroke-width="2"/>
<text x="637.0" y="132.0" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="600">Check</text>
<text x="637" y="148" font-size="10.5" fill="#5d6577" text-anchor="middle" font-weight="400">--check "your command"</text>
<line x1="712" y1="127" x2="740" y2="127" stroke="#7b8296" stroke-width="2" marker-end="url(#a)"/>
<rect x="740" y="92" width="150" height="70" rx="10" fill="#fff" stroke="#2f9e6b" stroke-width="2"/>
<text x="815.0" y="132.0" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="600">Restore</text>
<text x="815" y="148" font-size="10.5" fill="#5d6577" text-anchor="middle" font-weight="400">back to before the fault</text>
<text x="450" y="206" font-size="13" fill="#5d6577" text-anchor="middle" font-weight="400">exit code 0 from the check = the app coped; the command exits 1 when it did not</text>
<text x="450" y="230" font-size="13" fill="#5d6577" text-anchor="middle" font-weight="400">faults a pod-level tool cannot take back (a dead control plane, a full disk) are safe: a restore undoes them</text>
</svg>
