<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 252" width="900" height="252" role="img" aria-label="Golden state, reset and matrix runs" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Golden state, reset and matrix runs</title>
<rect x="0.5" y="0.5" width="899" height="251" rx="14" fill="#f5f6f8" stroke="#d5d9e2"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8296"/></marker></defs>
<text x="450" y="32" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="700">golden, reset and matrix: every run starts clean</text>
<rect x="40" y="88" width="150" height="64" rx="10" fill="#fff" stroke="#d98e04" stroke-width="2"/>
<text x="115.0" y="118.0" font-size="15" fill="#1f2430" text-anchor="middle" font-weight="600">golden</text>
<text x="115.0" y="136.0" font-size="12" fill="#5d6577" text-anchor="middle" font-weight="400">known-good state</text>
<rect x="250" y="70" width="100" height="40" rx="8" fill="#fff" stroke="#3b6fd4" stroke-width="2"/><text x="300" y="95" font-size="13" fill="#1f2430" text-anchor="middle" font-weight="600">reset ≈8 s</text>
<line x1="350" y1="90" x2="392" y2="90" stroke="#7b8296" stroke-width="2" marker-end="url(#a)"/>
<rect x="394" y="70" width="130" height="40" rx="8" fill="#fff" stroke="#2f9e6b" stroke-width="2"/><text x="459" y="95" font-size="13" fill="#1f2430" text-anchor="middle" font-weight="600">run 1: pass</text>
<line x1="190" y1="120" x2="248" y2="90" stroke="#b9bfcc" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="124" width="100" height="40" rx="8" fill="#fff" stroke="#3b6fd4" stroke-width="2"/><text x="300" y="149" font-size="13" fill="#1f2430" text-anchor="middle" font-weight="600">reset ≈8 s</text>
<line x1="350" y1="144" x2="392" y2="144" stroke="#7b8296" stroke-width="2" marker-end="url(#a)"/>
<rect x="394" y="124" width="130" height="40" rx="8" fill="#fff" stroke="#d1453b" stroke-width="2"/><text x="459" y="149" font-size="13" fill="#1f2430" text-anchor="middle" font-weight="600">run 2: FAIL</text>
<line x1="190" y1="120" x2="248" y2="144" stroke="#b9bfcc" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="178" width="100" height="40" rx="8" fill="#fff" stroke="#3b6fd4" stroke-width="2"/><text x="300" y="203" font-size="13" fill="#1f2430" text-anchor="middle" font-weight="600">reset ≈8 s</text>
<line x1="350" y1="198" x2="392" y2="198" stroke="#7b8296" stroke-width="2" marker-end="url(#a)"/>
<rect x="394" y="178" width="130" height="40" rx="8" fill="#fff" stroke="#2f9e6b" stroke-width="2"/><text x="459" y="203" font-size="13" fill="#1f2430" text-anchor="middle" font-weight="600">run 3: pass</text>
<line x1="190" y1="120" x2="248" y2="198" stroke="#b9bfcc" stroke-width="2" marker-end="url(#a)"/>
<text x="700" y="110" font-size="14" fill="#1f2430" text-anchor="middle" font-weight="700">2 of 3 runs passed; failed: 2</text>
<text x="700" y="132" font-size="12" fill="#5d6577" text-anchor="middle" font-weight="400">exit code 1 if any run failed</text>
<text x="700" y="168" font-size="12" fill="#5d6577" text-anchor="middle" font-weight="400">a test that fails some of the time is flaky,</text>
<text x="700" y="186" font-size="12" fill="#5d6577" text-anchor="middle" font-weight="400">one that fails every time is broken</text>
</svg>
