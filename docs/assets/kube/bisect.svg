<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 298" width="890" height="298" role="img" aria-label="Binary search over automatic checkpoints" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Binary search over automatic checkpoints</title>
<rect x="0.5" y="0.5" width="889" height="297" rx="14" fill="#f5f6f8" stroke="#d5d9e2"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8296"/></marker></defs>
<text x="450" y="32" font-size="18" fill="#1f2430" text-anchor="middle" font-weight="700">kube bisect: find the checkpoint where it broke</text>
