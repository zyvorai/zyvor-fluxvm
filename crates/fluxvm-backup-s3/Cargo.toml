[package]
name = "fluxvm-backup-s3"
version = "0.4.10"
edition = "2024"
license = "Apache-2.0"
description = "Backup chain storage for Zyvor FluxVM: manifests, S3 and directory object stores, layer encryption"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
md5 = { package = "md-5", version = "0.10" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
