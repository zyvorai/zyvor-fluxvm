# traefik/whoami: answers with the name of the pod that served the request, to see load balancing work.
#   kubectl port-forward svc/fluxvm-whoami 8082:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxvm-whoami
  labels:
    app.kubernetes.io/name: fluxvm-whoami
    app.kubernetes.io/managed-by: fluxctl-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxvm-whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxvm-whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: fluxvm-whoami
  labels:
    app.kubernetes.io/managed-by: fluxctl-template
spec:
  selector:
    app.kubernetes.io/name: fluxvm-whoami
  ports:
    - port: 80
      targetPort: 80
