[package]
name = "fluxvm-microvm"
version = "0.4.21"
edition = "2024"
license = "LicenseRef-Zyvor-Production-2.0"
description = "FluxVM MicroVM — Kubernetes-native MicroVM compute"

[[bin]]
name = "fluxvm-microvm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["v1_33"] }
kube = { version = "5.1", features = ["runtime", "derive", "client", "rustls-tls"], default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fluxvm-kube = { path = "../fluxvm-kube" }

[dev-dependencies]
tempfile = "3"
# The direct network body is checked against the daemon's own model.
fluxvm-core = { path = "../fluxvm-core" }
