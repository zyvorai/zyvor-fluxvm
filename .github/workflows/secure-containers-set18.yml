name: secure-containers-set18
on:
  pull_request:
    paths:
      - 'controllers/fluxvm-networkpolicy-controller/**'
      - 'scripts/test-networkpolicy-endpointslice-set18.sh'
      - 'docs/secure-containers-set18.md'
      - '.github/workflows/secure-containers-set18.yml'
  push:
    paths:
      - 'controllers/fluxvm-networkpolicy-controller/**'
      - 'scripts/test-networkpolicy-endpointslice-set18.sh'
      - 'docs/secure-containers-set18.md'
# Collapse superseded runs of this workflow on the same ref so queued duplicates do not hold the org's runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controllers/fluxvm-networkpolicy-controller
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: controllers/fluxvm-networkpolicy-controller/go.mod
      - run: gofmt -w cmd internal
      - run: git diff --exit-code
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
  shell-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/test-networkpolicy-endpointslice-set18.sh
      - run: |
          grep -Fq 'resources: ["endpointslices"]' controllers/fluxvm-networkpolicy-controller/deploy/rbac.yaml
