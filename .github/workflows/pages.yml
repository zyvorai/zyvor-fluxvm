# Requires GitHub Pages enabled with Source = "GitHub Actions" (repo Settings
# > Pages), done once via `gh api repos/<org>/<repo>/pages -X POST -f
# build_type=workflow` for this repo.
name: Deploy Docs Site
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}
# A queued deploy is not thrown away by the next push: GitHub keeps the newest pending run and the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    # Hosted-runner jobs for this org have sat queued for hours, so this runs on the Mac mini runner (same labels as macos.yml).
    runs-on: [self-hosted, macOS, ARM64, fluxvm-mac]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with: {node-version: '22', cache: npm, cache-dependency-path: website/package-lock.json}
    - run: npm --prefix website ci
    - run: npm --prefix website run build
    - uses: actions/upload-pages-artifact@v5
      with: {path: website/build}
  deploy:
    needs: build
    # Hosted-runner jobs for this org have sat queued for hours, so this runs on the Mac mini runner (same labels as macos.yml).
    runs-on: [self-hosted, macOS, ARM64, fluxvm-mac]
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    permissions: {pages: write, id-token: write}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
