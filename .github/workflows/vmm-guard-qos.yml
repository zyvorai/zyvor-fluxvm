name: VMM Guard and Adaptive QoS

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'bpf/fluxvm_guard.bpf.c'
      - 'crates/fluxvm-intelligence/**'
      - 'tools/fluxvm-guard-*.c'
      - 'crates/fluxvm-core/src/signing.rs'
      - 'scripts/*vmm-guard*'
      - 'scripts/ci-privileged-guard-test.sh'
      - 'scripts/build-runtime-intelligence.sh'
      - 'scripts/install-runtime-intelligence.sh'
      - '.github/workflows/vmm-guard-qos.yml'
  push:
    paths:
      - 'bpf/fluxvm_guard.bpf.c'
      - 'crates/fluxvm-intelligence/**'
      - 'tools/fluxvm-guard-*.c'
      - 'crates/fluxvm-core/src/signing.rs'
      - 'scripts/*vmm-guard*'
      - 'scripts/ci-privileged-guard-test.sh'
      - 'scripts/build-runtime-intelligence.sh'
      - 'scripts/install-runtime-intelligence.sh'

# Collapse superseded runs of this workflow on the same ref so queued duplicates do not hold the org's runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: fluxvm
      - uses: actions/checkout@v7
        with:
          repository: zyvorai/guestkit
          path: guestkit
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev pkg-config libsystemd-dev libhivex-dev linux-tools-common linux-tools-generic python3-yaml
      - name: Cargo tests
        working-directory: fluxvm
        run: cargo test -p fluxvm-intelligence
      - name: Build VMM Guard BPF
        working-directory: fluxvm
        run: ./scripts/build-vmm-guard.sh /tmp/fluxvm-bpf
      - name: Compile guard helpers against real libbpf
        working-directory: fluxvm
        run: |
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-guard-loader.c -o /tmp/fluxvm-guard-loader $(pkg-config --cflags --libs libbpf)
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-guard-events.c -o /tmp/fluxvm-guard-events $(pkg-config --cflags --libs libbpf)
      - name: Static gates
        working-directory: fluxvm
        run: ./scripts/test-vmm-guard-qos-static.sh

  # Needs root and a BPF-LSM kernel, so it runs on the kernel runner, never for pull
  # requests, and only after a reviewer approves the privileged-ebpf environment.
  # The runner user may sudo only the wrapper below (docs/host-hardening.md).
  privileged:
    if: ${{ vars.FLUXVM_EBPF_PRIVILEGED_CI == '1' && github.event_name != 'pull_request' }}
    needs: portable
    runs-on: [self-hosted, Linux, X64, kernel]
    environment: privileged-ebpf
    steps:
      - uses: actions/checkout@v7
        with:
          path: fluxvm
      - uses: actions/checkout@v7
        with:
          repository: zyvorai/guestkit
          path: guestkit
      - name: Build guard and fluxctl
        working-directory: fluxvm
        run: cargo build -p fluxctl -p fluxvm-intelligence --bin fluxctl --bin fluxvm-guard
      - name: Exec allow-list and rule pack test (root, BPF-LSM)
        working-directory: fluxvm
        run: sudo /usr/local/sbin/fluxvm-ci-guard-test "$PWD"
