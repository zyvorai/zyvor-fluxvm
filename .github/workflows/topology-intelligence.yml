name: topology-intelligence
on:
  pull_request:
    paths:
      - 'bpf/fluxvm_topology.bpf.c'
      - 'crates/fluxvm-intelligence/**'
      - 'tools/fluxvm-topology-*.c'
      - 'scripts/*topology*'
      - '.github/workflows/topology-intelligence.yml'
  push:
    # A release tag push must not start this CI; it only competes with the release workflows for runners.
    # Defining only tags-ignore would stop branch pushes from triggering this workflow at all, so branches stays explicit.
    branches: ['**']
    tags-ignore: ['**']
    paths:
      - 'bpf/fluxvm_topology.bpf.c'
      - 'crates/fluxvm-intelligence/**'
      - 'tools/fluxvm-topology-*.c'
      - 'scripts/*topology*'
      - '.github/workflows/topology-intelligence.yml'

# Collapse superseded runs of this workflow on the same ref so queued duplicates do not hold the org's runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fluxvm
        uses: actions/checkout@v7
        with:
          path: fluxvm
      - name: Checkout guestkit sibling dependency
        uses: actions/checkout@v7
        with:
          repository: zyvorai/guestkit
          ref: v1.2.9   # packaging/guestkit.ref; checked by scripts/check-guestkit-pin.sh
          path: guestkit
      - uses: dtolnay/rust-toolchain@stable
      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-tools-common linux-tools-generic pkg-config libsystemd-dev libhivex-dev taskset || sudo apt-get install -y clang llvm libbpf-dev linux-tools-common linux-tools-generic pkg-config libsystemd-dev libhivex-dev util-linux
      - name: Rust tests
        working-directory: fluxvm
        run: cargo test -p fluxvm-intelligence topology
      - name: Build topology BPF and helpers
        working-directory: fluxvm
        run: |
          ./scripts/build-topology-intelligence.sh /tmp/fluxvm-topology-bpf
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-topology-loader.c -o /tmp/fluxvm-topology-loader $(pkg-config --cflags --libs libbpf)
          cc -O2 -g -Wall -Wextra -Werror tools/fluxvm-topology-events.c -o /tmp/fluxvm-topology-events $(pkg-config --cflags --libs libbpf)
      - name: Portable gates
        working-directory: fluxvm
        run: ./scripts/test-topology-static.sh
      - name: Privileged host test
        if: ${{ vars.FLUXVM_EBPF_PRIVILEGED_CI == '1' }}
        working-directory: fluxvm
        # sudo resets PATH (secure_path), CARGO_HOME and HOME, so root cannot find the runner user's rustup toolchain: pass them through.
        run: sudo -E env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" ./scripts/test-topology-host.sh
